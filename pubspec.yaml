name: syncwave
description: Multi-phone Wi-Fi synchronized MP3 player (Host & Client with in-RAM pre-buffering).
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  file_picker: ^13.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
