name: syncwave
description: Play one MP3 on many phones at the same time over Wi-Fi.
publish_to: "none"
version: 2.1.1+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  file_picker: ^13.1.0
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
