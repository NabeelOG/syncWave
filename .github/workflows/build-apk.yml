name: Build SyncWave Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --project-name syncwave --org com.nabeel .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # compileSdk 36 (needed by current plugins) with targetSdk 34 so Android
          # does not apply Local Network Protection and block the Wi-Fi server.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i -E 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
          else
            sed -i -E 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i -E 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
            sed -i -E 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          fi

          flutter pub get

          # Keep plugin compileSdk at 36 so the Android AAR metadata check passes.
          find "$PUB_CACHE" android -name "build.gradle*" -exec sed -i -E 's/(compileSdkVersion|compileSdk)([[:space:]=(]+)3[0-5]/\1\236/g' {} +

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
