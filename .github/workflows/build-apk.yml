name: Build SyncWave Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files & Restore Custom Manifest
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/CustomAndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --project-name syncwave .
          cp /tmp/CustomAndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get
          find "$PUB_CACHE" android -name "build.gradle*" -exec sed -i -E 's/(compileSdkVersion|compileSdk)([[:space:]=(]+)3[0-5]/\1\236/g' {} +

      - name: Build Release APK (No R8 Shrinking to Preserve CameraX & MLKit)
        run: flutter build apk --release --no-shrink

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncWave-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
